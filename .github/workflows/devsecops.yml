name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-sast:
    name: 1. Lint & SAST Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter & SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff (Syntax & Code Linting)
        run: ruff check . --select=E9,F63,F7,F82,F401

      - name: Run Bandit (SAST Security Scan)
        run: bandit -r . -x ./.venv,./venv -ll

  build-and-trivy-scan:
    name: 2. Container Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker/Podman Container Image
        run: docker build -t saturn-secrets:ci-test .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "saturn-secrets:ci-test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
