{% extends "base.html" %}

{% block content %}
    <h2>📝 Create Account</h2>

    {% if error %}
        <p style="color: red; font-weight: bold;">⚠️ Error: {{ error }}</p>
    {% endif %}
    
    <form action="/register" method="post">
        <label for="username">Choose Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <label for="password_repeat">Repeat Password:</label><br>
        <input type="password" id="password_repeat" name="password_repeat" required><br><br>

        <label for="captcha_answer">{{ captcha_question }}</label>
        <input type="text" id="captcha_answer" name="captcha_answer" required placeholder="Enter the number"><br><br>
        
        <button type="submit">Register Account</button>
    </form>
    
    <p>Already have an account? <a href="/login">Log in here</a></p>
{% endblock %}
