{% extends "base.html" %}

{% block content %}
    <h2>📝 Change password</h2>

    {% if success_message %}
        <p style="color: green; font-weight: bold;">✅ Success: {{ success_message }}</p>
    {% endif %}
    {% if error %}
        <p style="color: red; font-weight: bold;">⚠️ Error: {{ error }}</p>
    {% endif %}
    
    <form action="/dashboard/change-password" method="post">
        <label for="password">Current Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <label for="new_password">New Password:</label><br>
        <input type="password" id="new_password" name="new_password" required><br><br>
        
        <label for="new_password_repeat">Confirm New Password:</label><br>
        <input type="password" id="new_password_repeat" name="new_password_repeat" required><br><br>
        
        <button type="submit">Change Password</button>
    </form>

    <br><a href="/dashboard/account">Back to Profile</a>
{% endblock %}
