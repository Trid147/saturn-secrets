<!DOCTYPE html>
<html lang="en" data-theme="{{ 'dark' if dark_mode else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn Secrets</title>

    <link rel="icon" type="image/svg+xml" href="/static/saturn.svg?v=2">
    <link rel="stylesheet" href="/static/pico.min.css">

    <style>
        [data-theme="dark"] {
            --pico-background-color: #0b0d1e;
            --pico-card-background-color: #131633;
            --pico-form-element-background-color: #131633;
            --pico-form-element-border-color: #2e3466;
            --pico-primary: #facc15;
            --pico-primary-background: #facc15;
            --pico-primary-border: #eab308;
            --pico-primary-hover: #fde047;
            --pico-primary-hover-background: #fde047;
            --pico-primary-inverse: #0b0d1e;
        }

        body {
            max-width: 750px;
            margin: 0 auto;
            padding: 1rem;
        }
        header a { margin-right: 12px; }
        .settings-box {
            padding: 15px;
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .secret-box {
            padding: 15px;
            border-left: 5px solid #facc15;
            background-color: var(--pico-card-background-color);
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <strong style="color: #facc15; margin-right: 15px;">🪐 Saturn Secrets</strong>
        <a href="/">Create Secret</a>
        {% if not authorized %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% else %}
            <a href="/dashboard">ST</a>
        {% endif %}
        <hr>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <hr>
        <small>Contact / Support: @trid_doe (Telegram)</small>
    </footer>
</body>
</html>
