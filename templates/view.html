<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <title>View Secret</title>
</head>
<body>
    <h1>🔒 Saturn Secrets - Secure One-Time View</h1>
    {% if error %}
        <h2 style="color: red;">{{ error }}</h2>
    {% else %}
        <h2>Your Secret Content:</h2>
        <div style="background: #f0f0f0; padding: 15px; border-left: 5px solid red; font-family: monospace; white-space: pre-wrap;">{{ secret_text }}</div>
        <p><strong>Notice:</strong>This data has been completely wiped out from the database. Refreshing the page will result in an error.</p>

    {% endif %}

    <br>
    <a href="/">Create a new secret</a>
</body>
</html>
