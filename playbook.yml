---
- name: Deploy Saturn Secrets
  hosts: ubuntu_server
  become: true

  tasks:
    - name: Install Podman and podman-compose
      apt:
        name:
          - podman
          - podman-compose
        state: present
        update_cache: yes

    - name: Create project folder
      file:
        path: /root/saturn-secrets
        state: directory

    - name: Create data folder for SQLite
      file:
        path: /root/saturn-secrets/data
        state: directory

    - name: Copy compose.yml to server
      copy:
        src: compose.yml
        dest: /root/saturn-secrets/compose.yml

    - name: Copy .env file to server
      copy:
        src: .env
        dest: /root/saturn-secrets/.env
        mode: "0600"
    
    - name: Pull latest version from GitHub
      command:
        cmd: podman-compose pull
        chdir: /root/saturn-secrets

    - name: Allow 443 HTTPS port
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Start container with podman-compose
      command:
        cmd: podman-compose up -d --force-recreate
        chdir: /root/saturn-secrets

    - name: Copy Nginx config
      copy:
        src: nginx.conf
        dest: /etc/nginx/sites-available/default
        force: no

    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

    - name: Install Certbot for Nginx
      apt:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Obtain and configure free Let's Encrypt HTTPS certificate
      command:
        cmd: certbot --nginx -d saturn-secrets.ru -d www.saturn-secrets.ru --non-interactive --agree-tos -m tttttddddd@gmail.com --redirect
      args:
        creates: /etc/letsencrypt/live/saturn-secrets.ru/fullchain.pem